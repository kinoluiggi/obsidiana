<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Obsidiana</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222222;
      --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.18);
      --text: #e8e4dc; --text-muted: #7a756c; --text-hint: #4a4640;
      --accent: #c8a96e; --accent-dim: rgba(200,169,110,0.12);
      --danger: #c0614a; --radius: 10px; --radius-sm: 6px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; }
    header { text-align: center; margin-bottom: 2.5rem; max-width: 560px; }
    h1 { font-size: 26px; font-weight: normal; color: var(--text); line-height: 1.3; margin-bottom: 0.5rem; }
    .subtitle { font-size: 13px; color: var(--text-muted); font-style: italic; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 560px; margin-bottom: 1rem; }
    .section-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-hint); font-family: 'Courier New', monospace; margin-bottom: 0.75rem; }
    input[type="password"], textarea { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; padding: 9px 12px; width: 100%; outline: none; transition: border-color 0.15s; }
    input:focus, textarea:focus { border-color: var(--border-hover); }
    .mode-toggle { display: flex; gap: 6px; margin-bottom: 1.25rem; }
    .mode-btn { flex: 1; padding: 8px 6px; font-size: 12px; font-family: 'Courier New', monospace; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .mode-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .mode-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .drop-zone { border: 1px dashed var(--border-hover); border-radius: var(--radius); padding: 2.5rem 1rem; text-align: center; cursor: pointer; transition: all 0.15s; background: var(--surface2); margin-bottom: 1rem; }
    .drop-zone:hover { border-color: var(--accent); background: var(--accent-dim); }
    .drop-zone input { display: none; }
    .drop-icon { font-size: 32px; margin-bottom: 0.5rem; opacity: 0.4; }
    .drop-text { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; }
    .drop-hint { font-size: 12px; color: var(--text-hint); font-style: italic; }
    #preview { width: 100%; max-height: 340px; object-fit: contain; border-radius: var(--radius-sm); margin-bottom: 1rem; display: none; border: 0.5px solid var(--border); }
    textarea { resize: vertical; min-height: 60px; font-family: 'Georgia', serif; font-size: 13px; margin-top: 0.75rem; }
    .analyze-btn { width: 100%; padding: 12px; margin-top: 1rem; background: transparent; border: 0.5px solid var(--accent); border-radius: var(--radius-sm); color: var(--accent); font-size: 14px; font-family: 'Courier New', monospace; letter-spacing: 0.1em; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
    .analyze-btn:hover:not(:disabled) { background: var(--accent-dim); }
    .analyze-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border); color: var(--text-muted); }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--border-hover); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 560px; margin-top: 1rem; }
    .result-mode-badge { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); font-family: 'Courier New', monospace; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 0.5px solid var(--border); }
    .result-section { margin-bottom: 1.25rem; }
    .result-section:last-child { margin-bottom: 0; }
    .result-section-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-hint); font-family: 'Courier New', monospace; margin-bottom: 6px; }
    .result-section-text { font-size: 14px; color: var(--text); line-height: 1.75; }
    .error-text { color: var(--danger); font-size: 13px; font-family: 'Courier New', monospace; }
    @media (max-width: 480px) { .mode-toggle { flex-direction: column; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
<header>
  <h1>Analizador de Obsidiana</h1>
  <p class="subtitle">Identificación visual de tipo, procedencia y talla mesoamericana</p>
</header>

<div class="card">
  <div class="section-label">Modo de análisis</div>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('color')" id="btn-color">Color / procedencia</button>
    <button class="mode-btn" onclick="setMode('talla')" id="btn-talla">Talla / antigüedad</button>
    <button class="mode-btn" onclick="setMode('completo')" id="btn-completo">Análisis completo</button>
  </div>
  <div class="drop-zone" onclick="document.getElementById('fileInput').click()" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
    <div class="drop-icon">◈</div>
    <p class="drop-text">Toca para subir foto de la pieza</p>
    <p class="drop-hint">JPG, PNG, HEIC — luz directa + transmitida si puedes</p>
  </div>
  <img id="preview" alt="Vista previa de la pieza">
  <textarea id="contextInput" placeholder="Contexto opcional: procedencia, dimensiones, algo que notes..."></textarea>
  <button class="analyze-btn" id="analyzeBtn" onclick="analyze()" disabled>— Analizar pieza —</button>
</div>

<div id="result"></div>

<script>
const GROQ_KEY = 'TU_KEY_AQUI';

let currentMode = 'color';
let imageBase64 = null;
let imageType = null;

function setMode(mode) {
  currentMode = mode;
  ['color','talla','completo'].forEach(m => {
    document.getElementById('btn-' + m).classList.toggle('active', m === mode);
  });
}

function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  imageType = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = e => {
    imageBase64 = e.target.result.split(',')[1];
    const preview = document.getElementById('preview');
    preview.src = e.target.result;
    preview.style.display = 'block';
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('dropZone').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

const prompts = {
  color: `Eres un especialista en obsidiana mesoamericana con conocimiento en arqueología lapidaria y geología volcánica. Analiza esta imagen de obsidiana e identifica:\n\n1. TIPO CROMÁTICO: color(es) presentes, traslucidez, lustre, efectos ópticos (iridiscencia, bandas, inclusiones visibles)\n2. PROCEDENCIA PROBABLE: yacimiento mesoamericano más probable (Sierra de las Navajas/Pachuca, Otumba, Ucareo, El Chayal, Zaragoza-Oyameles, Altotonga, Pico de Orizaba, u otro) con nivel de confianza (alto/medio/bajo)\n3. INDICADORES VISUALES: qué elementos específicos de la imagen sustentan tu identificación\n4. DUDAS O LIMITACIONES: qué no puedes determinar solo por la foto y por qué\n\nSé técnico y preciso. Si la imagen tiene mala iluminación o ángulo desfavorable, indícalo.`,
  talla: `Eres un especialista en tecnología lítica mesoamericana y arqueología. Analiza esta imagen de obsidiana y evalúa:\n\n1. EVIDENCIA DE TALLA INTENCIONAL: ¿hay bulbo de percusión, ondas de Hertz, estrías de lascado, plataforma preparada, aristas dorsales? ¿Qué tipo de pieza es (lasca, navaja prismática, bifacial, núcleo, desecho, punto)?\n2. MARCADORES DE ANTIGÜEDAD VISUAL: pátina, depósitos minerales en negativos de lascado, desgaste de aristas, hidratación superficial visible, alteración del lustre\n3. PROBABILIDAD DE MANUFACTURA PREHISPÁNICA vs. contemporánea: con justificación visual\n4. LO QUE NO SE PUEDE DETERMINAR: qué requeriría análisis físico (hidratación con microscopio, EDXRF, contexto estratigráfico)\n\nSé directo. Habla de lo que ves, no de lo que supones.`,
  completo: `Eres un especialista en obsidiana mesoamericana — arqueólogo lapidario con conocimiento en geología volcánica, tecnología lítica y análisis de procedencia. Esta es una pieza de colección privada. Haz un análisis completo:\n\n1. TIPO CROMÁTICO Y PROCEDENCIA: color, traslucidez, lustre, efectos ópticos; yacimiento probable con nivel de confianza\n2. TIPO DE PIEZA Y TALLA: morfología, técnica de reducción, presencia de bulbo, ondas, aristas, plataforma; ¿navaja, lasca, bifacial, punta, núcleo, objeto lapidario?\n3. MARCADORES DE ANTIGÜEDAD: pátina, depósitos, desgaste, alteración superficial observable\n4. VALORACIÓN GENERAL: ¿qué tan significativa parece la pieza? ¿Qué preguntas abre?\n5. PRÓXIMOS PASOS: qué análisis físicos o consultas ampliarían el conocimiento sobre esta pieza\n\nTono técnico pero directo, como si hablaras con alguien que conoce el material.`
};

async function analyze() {
  if (!imageBase64) return;
  const btn = document.getElementById('analyzeBtn');
  const resultDiv = document.getElementById('result');
  const context = document.getElementById('contextInput').value.trim();
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>analizando...';
  resultDiv.innerHTML = '';
  const prompt = prompts[currentMode] + (context ? '\n\nContexto adicional: ' + context : '');
  const body = {
    model: "meta-llama/llama-4-scout-17b-16e-instruct",
    messages: [{ role: "user", content: [
      { type: "image_url", image_url: { url: `data:${imageType};base64,${imageBase64}` } },
      { type: "text", text: prompt }
    ]}],
    max_tokens: 1024
  };
  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_KEY}` },
      body: JSON.stringify(body)
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.choices?.[0]?.message?.content || 'Sin respuesta.';
    resultDiv.innerHTML = renderResult(text);
  } catch(err) {
    resultDiv.innerHTML = `<div class="result-card"><p class="error-text">Error: ${err.message}</p></div>`;
  }
  btn.disabled = false;
  btn.innerHTML = '— Analizar otra vez —';
}

function renderResult(text) {
  const modeLabels = { color: 'Color · Procedencia', talla: 'Talla · Antigüedad', completo: 'Análisis completo' };
  let html = `<div class="result-card"><div class="result-mode-badge">${modeLabels[currentMode]}</div>`;
  const paragraphs = text.split(/\n\n+/).filter(p => p.trim());
  paragraphs.forEach(p => {
    const trimmed = p.trim().replace(/\*\*/g, '');
    if (/^\d+\.\s*[A-ZÁÉÍÓÚÑ\s\/·]+:/.test(trimmed)) {
      const colonIdx = trimmed.indexOf(':');
      const label = trimmed.substring(0, colonIdx).replace(/^\d+\.\s*/, '').trim();
      const content = trimmed.substring(colonIdx + 1).trim();
      html += `<div class="result-section"><div class="result-section-label">${label}</div><div class="result-section-text">${content.replace(/\n/g, '<br>')}</div></div>`;
    } else {
      html += `<div class="result-section"><div class="result-section-text">${trimmed.replace(/\n/g, '<br>')}</div></div>`;
    }
  });
  html += '</div>';
  return html;
}
</script>
</body>
</html>
